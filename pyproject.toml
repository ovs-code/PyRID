[project]
name = "PyRID"
version = "0.0.1"
description = "PyRID is a Python library for particle-based reaction diffusion simulations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.15.1",
    "kaleido>=1.2.0",
    "matplotlib>=3.10.8",
    "numba==0.63.1",
    "plotly>=6.5.2",
    "pyvis>=0.3.2",
    "scipy>=1.17.0",
    "seaborn>=0.13.2",
]


[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["."]
include = ["pyrid*"]
